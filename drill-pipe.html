 <h1>Каталог бурильных труб</h1>

<label>Нормативный документ:</label>
<select id="standard" onchange="stepShow(1)"></select>

<label>Наружный диаметр трубы (мм):</label>
<select id="pipe_od" onchange="stepShow(2)" disabled></select>

<label>Толщина стенки (мм):</label>
<select id="wall" onchange="stepShow(3)" disabled></select>

<label>Допуск по толщине стенки, %:</label>
<select id="tolerance" onchange="stepShow(4)" disabled></select>

<label>Группа прочности:</label>
<select id="grade" onchange="stepShow(5)" disabled></select>

<label>Тип высадки:</label>
<select id="upset" onchange="stepShow(6)" disabled></select>

<label>Исполнение замка:</label>
<select id="joint_type" onchange="stepShow(7)" disabled></select>

<label>Тип замкового соединения:</label>
<select id="joint_style" onchange="stepShow(8)" disabled></select>

<label>Наружный диаметр замка (мм):</label>
<select id="od_joint" onchange="stepShow(9)" disabled></select>

<label>Внутренний диаметр замка (мм):</label>
<select id="id_joint" onchange="stepShow(10)" disabled></select>

<label>Группа длин:</label>
<select id="length_group" onchange="stepShow(11)" disabled></select>

<label>Длина трубы (м):</label>
<div id="pipe_length_wrapper">
  <select id="pipe_length_select" disabled></select>
  <input type="number" id="pipe_length_input" style="display:none;" step="0.01" />
  <span id="pipe_length_hint" class="length-hint" style="display: none;"></span>
  <input type="hidden" id="pipe_length" name="Pipe Length, m" />
</div>


<label>Длина ниппеля под ключ (мм):</label>
<div id="pin_length_wrapper">
  <select id="pin_length" onchange="stepShow(12)" disabled></select>
  <input type="number" id="pin_length_input" style="display:none;" step="0.1" />
</div>


<label>Длина ниппеля под ключ (мм):</label>
<div id="nipple_wrapper">
  <select id="nipple_length" disabled></select>
  <input type="number" id="nipple_length_input" class="manual-input" />
<span id="nipple_length_hint" class="field-hint"></span>
  <input type="hidden" id="nipple_length_hidden" name="Nipple Length, mm" />
</div>



<label>Длина муфты под ключ (мм):</label>
<div id="box_length_wrapper">
  <select id="box_length" onchange="stepShow(13)" disabled></select>
  <input type="number" id="box_length_input" style="display:none;" step="0.1" />
</div>




  <button id="findBtn" onclick="findPipe()" disabled>Найти трубу</button>
